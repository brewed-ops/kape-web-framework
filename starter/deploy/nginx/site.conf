# Nginx config for the static build (dist/). Drop into /etc/nginx/conf.d/ (it is included in the http context).
# Same header policy as public/_headers, vercel.json and netlify.toml: change all four together,
# then run `npm run check:headers -- https://your-domain`.
#
# Before use: replace example.com, the dist root and the certificate paths (certbot --nginx fills these in).
# HSTS has NO "preload" on purpose: preload gets the domain baked into browsers and is very hard to undo.
#
# Note on add_header: a location block that declares its own add_header DROPS every add_header from the
# server block. That is why caching is driven by the $cache_control map below and no location sets headers.

map $uri $cache_control {
    default            "public, max-age=0, must-revalidate";
    ~^/_astro/         "public, max-age=31536000, immutable";
}

# HTTP -> HTTPS. Keep the ACME path open so certificate renewal keeps working.
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://example.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;
    server_tokens off;                      # no nginx version in headers or error pages

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root  /var/www/example.com/dist;
    index index.html;

    # Request size cap (the static site accepts no uploads)
    client_max_body_size 16k;

    # Security headers (identical to public/_headers)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control $cache_control always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # Dotfiles (.env, .git, .htaccess...) are never served. /.well-known/ stays open for security.txt and ACME.
    location ~ /\.(?!well-known) {
        return 404;
    }
    # Backups and archives that scanners look for within minutes of launch.
    location ~* \.(zip|bak|sql|env|log|tar|gz|old|swp)$ {
        return 404;
    }

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # The contact form posts to /api/contact, a Cloudflare Pages Function. On plain Nginx that endpoint does not
    # exist: point site.forms.action in src/config/site.ts at your own form handler (see docs/HANDOFF.md).
}
